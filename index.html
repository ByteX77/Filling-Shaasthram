<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILLING ശാസ്ത്രം</title>
    <link href="https://fonts.googleapis.com/css2?family=Kablammo&family=Rubik+Glitch&family=Zilla+Slab+Highlight:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Wild Alien & Beast Background Chaos -->
    <div class="space-creature c-1">👽</div>
    <div class="space-creature c-2">🐘</div>
    <div class="space-creature c-3">🛸</div>
    <div class="space-creature c-4">🐙</div>
    <div class="space-creature c-5">🦖</div>
    <div class="space-creature c-6">🌮</div>
    <div class="space-creature c-7">⚡</div>
    <div class="space-creature c-8">🔥</div>

    <div class="mad-arena">
        <h1 class="glitch-title">FILLING <span class="sub-script">ശാസ്ത്രം</span></h1>
        <p class="cyber-subtitle">THE MADNESS CALCULATOR OF ABSOLUTE DESTRUCTION 🌀🔥</p>

        <div class="inputs-grid">
            <div class="field-wrap">
                <label for="container-obj">TARGET VESSEL</label>
                <input type="text" id="container-obj" placeholder="e.g., A Giant Spaceship, Black Hole">
            </div>

            <div class="field-wrap">
                <label for="filler-obj">CHAOTIC AMMO</label>
                <input type="text" id="filler-obj" placeholder="e.g., Flying Elephants, Lasagna">
            </div>
        </div>

        <button id="calc-btn" onclick="calculateFilling()">
            IGNITE THE ശാസ്ത്രം 🚀💥
        </button>

        <!-- Loading Animation -->
        <div id="loading" class="hidden">
            <div class="loading-alien">🛸 Ripping space-time fabric with wild elephants...</div>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="hidden">
            <h3 class="res-title">⚡ COSMIC VERDICT ⚡</h3>
            <p id="result-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
