<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILLING ശാസ്ത്രം</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Luckiest+Guy&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mad chaotic background elements -->
    <div class="bg-item e-1">🐘</div>
    <div class="bg-item e-2">🚀</div>
    <div class="bg-item e-3">🍌</div>
    <div class="bg-item e-4">🧪</div>
    <div class="bg-item e-5">💥</div>
    <div class="bg-item e-6">🎪</div>
    <div class="bg-item e-7">🦒</div>
    <div class="bg-item e-8">🍕</div>

    <div class="screen-wrapper">
        <h1 class="gigantic-title">FILLING <span class="malayalam-script">ശാസ്ത്രം</span></h1>
        <p class="epic-tagline">The Absolute Maximum Overdrive Volume Calculator of the Universe! ⚡🐘</p>

        <div class="inputs-flex-container">
            <div class="input-box-wrapper">
                <label for="container-obj">CONTAINER OF DOOM</label>
                <input type="text" id="container-obj" placeholder="e.g., The Entire Pacific Ocean, My Head">
            </div>

            <div class="input-box-wrapper">
                <label for="filler-obj">FILLER OF CHAOS</label>
                <input type="text" id="filler-obj" placeholder="e.g., Dancing Elephants, Spicy Samosas">
            </div>
        </div>

        <button id="calc-btn" onclick="calculateFilling()">
            LAUNCH THE ശാസ്ത്രം! 🚀✨
        </button>

        <!-- Loading Animation -->
        <div id="loading" class="hidden">
            <div class="mad-loading-text">🌀 Consulting wild dimensions & quantum elephants...</div>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="hidden">
            <h3 class="result-heading">🚨 MAD SCIENTIST DECREE 🚨</h3>
            <p id="result-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
