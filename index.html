<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILLING ശാസ്ത്രം</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating background cartoon elements / emojis -->
    <div class="floating-decor decor-1">🐘</div>
    <div class="floating-decor decor-2">🧪</div>
    <div class="floating-decor decor-3">🥥</div>
    <div class="floating-decor decor-4">🚀</div>
    <div class="floating-decor decor-5">🎪</div>

    <main class="mad-container">
        <div class="header-banner">
            <h1 class="main-title">FILLING <span class="ml-script">ശാസ്ത്രം</span></h1>
            <p class="subtitle">The ultra-mad, completely unhinged scientific volume calculator! 🧪✨</p>
        </div>

        <div class="calculator-card">
            <div class="input-group">
                <label for="container-obj">What do you want to fill?</label>
                <input type="text" id="container-obj" placeholder="e.g., A Maruti 800, My Bedroom, The Moon">
            </div>

            <div class="input-group">
                <label for="filler-obj">What will you fill it with?</label>
                <input type="text" id="filler-obj" placeholder="e.g., Coconuts, Elephants, Samosas">
            </div>

            <button id="calc-btn" onclick="calculateFilling()">
                <span>Do the ശാസ്ത്രം! 🔬🚀</span>
            </button>
        </div>

        <!-- Loading Animation -->
        <div id="loading" class="hidden">
            <div class="mad-loader">🐘🌀 calculating absurd physics...</div>
        </div>

        <!-- Result Box -->
        <div id="result-box" class="hidden">
            <h2>Mad Scientist Verdict:</h2>
            <p id="result-text"></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
